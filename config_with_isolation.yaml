num_cs: 4
threads_per_cs: 1
num_ms: 1
mem_per_ms: 1073741824
cas_delay_us: 2
base_rtt_us: 2.0
initial_slabs_per_size: 32768
maintenance_cs: 0
threads_per_maintenance_cs: 0
log_level: INFO
ops_per_client: 10000
warmup_inserts: 1000

# Advanced CPU core binding and isolation configuration
cpu_binding_enabled: true
cpu_binding_start_core: 0
cpu_isolation_required: false  # Set to true when cores are isolated via kernel parameters

# To enable isolation:
# 1. Add to /etc/default/grub GRUB_CMDLINE_LINUX:
#    isolcpus=0,1,2,3 nohz_full=0,1,2,3 rcu_nocbs=0,1,2,3
# 2. Run: sudo update-grub && sudo reboot
# 3. Verify: cat /sys/devices/system/cpu/isolated
# 4. Set cpu_isolation_required: true

distribution:
  type: uniform
  key_space: 200000000
operation_mix:
  insert: 1.0
  read: 0.0
  update: 0.0
  delete: 0.0